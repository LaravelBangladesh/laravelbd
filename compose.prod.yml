# Promtail ships these logs to Loki; rotation keeps the local json-file buffer
# bounded so a log spike cannot fill the disk.
x-logging: &default-logging
    driver: json-file
    options:
        max-size: '10m'
        max-file: '3'

services:
    app:
        image: ${APP_IMAGE:-ghcr.io/laravelbangladesh/laravelbd-app}:${APP_IMAGE_TAG:?set APP_IMAGE_TAG to the release version, e.g. 1.2.3}
        pull_policy: always
        restart: unless-stopped
        logging: *default-logging
        working_dir: /var/www/html
        env_file:
            - .env
        environment:
            INERTIA_SSR_URL: 'http://ssr:13714'
        volumes:
            - app_storage:/var/www/html/storage
            - public_assets:/var/www/html/public
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        networks:
            - laravel

    ssr:
        image: ${SSR_IMAGE:-ghcr.io/laravelbangladesh/laravelbd-ssr}:${APP_IMAGE_TAG:?set APP_IMAGE_TAG to the release version, e.g. 1.2.3}
        pull_policy: always
        restart: unless-stopped
        logging: *default-logging
        networks:
            - laravel

    queue:
        image: ${APP_IMAGE:-ghcr.io/laravelbangladesh/laravelbd-app}:${APP_IMAGE_TAG:?set APP_IMAGE_TAG to the release version, e.g. 1.2.3}
        pull_policy: always
        restart: unless-stopped
        logging: *default-logging
        working_dir: /var/www/html
        env_file:
            - .env
        command: php artisan queue:work --tries=3 --sleep=1
        volumes:
            - app_storage:/var/www/html/storage
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        networks:
            - laravel

    nginx:
        image: ${NGINX_IMAGE:-ghcr.io/laravelbangladesh/laravelbd-nginx}:${APP_IMAGE_TAG:?set APP_IMAGE_TAG to the release version, e.g. 1.2.3}
        pull_policy: always
        restart: unless-stopped
        logging: *default-logging
        ports:
            - '${HTTP_PORT:-80}:80'
            - '${HTTPS_PORT:-443}:443'
        volumes:
            - ${ORIGIN_CERT_PATH:-/etc/ssl/cloudflare}:/etc/nginx/certs:ro
            - public_assets:/var/www/html/public:ro
        depends_on:
            - app
        healthcheck:
            test:
                [
                    'CMD',
                    'wget',
                    '--no-verbose',
                    '--tries=1',
                    '--no-check-certificate',
                    '--spider',
                    'https://127.0.0.1/up',
                ]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 30s
        networks:
            - laravel

    postgres:
        image: postgres:18-alpine
        restart: unless-stopped
        logging: *default-logging
        environment:
            POSTGRES_DB: ${DB_DATABASE}
            POSTGRES_USER: ${DB_USERNAME}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
        volumes:
            - postgres_data:/var/lib/postgresql
        healthcheck:
            test:
                ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
            interval: 10s
            timeout: 5s
            retries: 10
        networks:
            - laravel

    redis:
        image: redis:8-alpine
        restart: unless-stopped
        logging: *default-logging
        command: redis-server --appendonly yes
        volumes:
            - redis_data:/data
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 10s
            timeout: 3s
            retries: 10
        networks:
            - laravel

volumes:
    postgres_data:
    redis_data:
    app_storage:
    public_assets:

networks:
    laravel:
        driver: bridge
