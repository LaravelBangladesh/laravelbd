services:
    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
            target: production
        restart: unless-stopped
        working_dir: /var/www/html
        env_file:
            - .env
        environment:
            INERTIA_SSR_URL: 'http://ssr:13714'
        volumes:
            - app_storage:/var/www/html/storage
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        networks:
            - laravel

    ssr:
        build:
            context: .
            dockerfile: docker/ssr/Dockerfile
        restart: unless-stopped
        networks:
            - laravel

    queue:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
            target: production
        restart: unless-stopped
        working_dir: /var/www/html
        env_file:
            - .env
        command: php artisan queue:work --tries=3 --sleep=1
        volumes:
            - app_storage:/var/www/html/storage
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        networks:
            - laravel

    nginx:
        image: nginx:1.29-alpine
        restart: unless-stopped
        ports:
            - '${HTTP_PORT:-80}:80'
            - '${HTTPS_PORT:-443}:443'
        volumes:
            - ./docker/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
            - ${ORIGIN_CERT_PATH:-/etc/ssl/cloudflare}:/etc/nginx/certs:ro
        depends_on:
            - app
        healthcheck:
            test:
                [
                    'CMD',
                    'wget',
                    '--no-verbose',
                    '--tries=1',
                    '--no-check-certificate',
                    '--spider',
                    'https://127.0.0.1/up',
                ]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 30s
        networks:
            - laravel

    postgres:
        image: postgres:18-alpine
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${DB_DATABASE}
            POSTGRES_USER: ${DB_USERNAME}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
        volumes:
            - postgres_data:/var/lib/postgresql
        healthcheck:
            test:
                ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
            interval: 10s
            timeout: 5s
            retries: 10
        networks:
            - laravel

    redis:
        image: redis:8-alpine
        restart: unless-stopped
        command: redis-server --appendonly yes
        volumes:
            - redis_data:/data
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 10s
            timeout: 3s
            retries: 10
        networks:
            - laravel

volumes:
    postgres_data:
    redis_data:
    app_storage:

networks:
    laravel:
        driver: bridge
