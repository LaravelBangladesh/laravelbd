services:
    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
            target: development
        container_name: lb-app
        restart: unless-stopped
        working_dir: /var/www/html
        volumes:
            - .:/var/www/html
            - ./docker/php/php.dev.ini:/usr/local/etc/php/conf.d/zz-app.ini:ro
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        environment:
            INERTIA_SSR_URL: 'http://ssr:13714'
            INERTIA_SSR_HOT_URL: 'http://vite:5173'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        networks:
            - laravel

    ssr:
        image: node:22-alpine
        container_name: lb-ssr
        restart: unless-stopped
        working_dir: /var/www/html
        command: sh -c "npm install && npm run build:ssr && node bootstrap/ssr/ssr.js"
        volumes:
            - .:/var/www/html
        environment:
            WAYFINDER_COMMAND: 'true'
        networks:
            - laravel

    queue:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
            target: development
        container_name: lb-queue
        restart: unless-stopped
        working_dir: /var/www/html
        command: php artisan queue:work --tries=3 --sleep=1
        volumes:
            - .:/var/www/html
            - ./docker/php/php.dev.ini:/usr/local/etc/php/conf.d/zz-app.ini:ro
        depends_on:
            - app
        networks:
            - laravel

    nginx:
        image: nginx:1.29-alpine
        container_name: lb-nginx
        restart: unless-stopped
        ports:
            - '${APP_PORT:-8080}:80'
        volumes:
            - .:/var/www/html
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - app
        networks:
            - laravel

    vite:
        image: node:22-alpine
        container_name: lb-vite
        restart: unless-stopped
        working_dir: /var/www/html
        command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
        ports:
            - '${VITE_PORT:-5173}:5173'
        volumes:
            - .:/var/www/html
        environment:
            VITE_HMR_HOST: localhost
            WAYFINDER_COMMAND: 'true'
        networks:
            - laravel

    postgres:
        image: postgres:18-alpine
        container_name: lb-postgres
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${DB_DATABASE:-laravel_bangladesh}
            POSTGRES_USER: ${DB_USERNAME:-laravel}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
        ports:
            - '${FORWARD_DB_PORT:-5432}:5432'
        volumes:
            - postgres_data:/var/lib/postgresql
        healthcheck:
            test:
                ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
            interval: 5s
            timeout: 5s
            retries: 10
        networks:
            - laravel

    redis:
        image: redis:8-alpine
        container_name: lb-redis
        restart: unless-stopped
        command: redis-server --appendonly yes
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - redis_data:/data
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            timeout: 3s
            retries: 10
        networks:
            - laravel

    mailpit:
        image: axllent/mailpit:latest
        container_name: lb-mailpit
        restart: unless-stopped
        ports:
            - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
            - '${FORWARD_MAILPIT_SMTP_PORT:-1025}:1025'
        networks:
            - laravel

volumes:
    postgres_data:
    redis_data:

networks:
    laravel:
        driver: bridge
