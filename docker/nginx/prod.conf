# Cloudflare terminates TLS at the edge and reconnects to this origin over TLS
# using a Cloudflare Origin Certificate (SSL mode "Full (strict)"). The origin
# never serves plaintext application traffic: :80 only issues redirects.

server_tokens off;

server {
    listen 80 default_server;
    server_name _;

    # ACME lives here if a future certbot/DNS-01 flow ever needs it.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html/public;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 64M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Vite emits content-hashed filenames, so a given URL never changes.
    location ^~ /build/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # index.php is the only PHP entrypoint; nothing else under public/ may execute.
    location ~ ^/index\.php(/|$) {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        # Vite preload Link headers plus encrypted cookies overflow nginx's 4k default.
        fastcgi_buffer_size 16k;
        fastcgi_buffers 8 16k;
        fastcgi_param HTTPS on;
        include fastcgi_params;
        # httpoxy: never let a client Proxy header reach PHP as HTTP_PROXY.
        fastcgi_param HTTP_PROXY "";
        fastcgi_hide_header X-Powered-By;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
