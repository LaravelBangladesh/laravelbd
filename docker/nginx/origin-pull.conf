# Cloudflare Authenticated Origin Pulls. With the feature enabled for the zone,
# every edge-to-origin request presents a client certificate signed by
# Cloudflare's Origin Pull CA. Verifying it proves the request really came
# through Cloudflare, independent of IP ranges or the Host header.
#
# The container healthcheck calls https://127.0.0.1/up without a certificate,
# so loopback is exempt. $remote_addr is only rewritten from CF-Connecting-IP
# for connections that arrive from Cloudflare, so loopback stays loopback.

geo $from_loopback {
    default   0;
    127.0.0.1 1;
    ::1       1;
}

map "$ssl_client_verify:$from_loopback" $reject_origin_pull {
    default     1;
    "~^SUCCESS:" 0;
    "~:1$"       0;
}
