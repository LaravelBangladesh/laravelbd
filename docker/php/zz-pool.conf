; The image default of five workers lets a handful of slow requests (an upload
; stalled on a remote API, say) starve every other visitor. Twenty workers at
; roughly 50 MB each fit comfortably on the 4 GB production VM.
[www]
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6

; nginx gives up after 60s (fastcgi_read_timeout). Kill the worker shortly after
; so it serves someone else instead of finishing a response nobody will read.
request_terminate_timeout = 65s
